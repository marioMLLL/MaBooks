name: macOS
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        run: bash scripts/test.sh
      - name: Package
        run: bash scripts/package-app.sh
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent dist/MaBooks.app dist/MaBooks.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MaBooks-arm64
          path: dist/MaBooks.zip
